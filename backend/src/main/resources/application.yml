spring:
  application:
    name: klab-task-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  cors:
    origins: ${CORS_ORIGINS:https://task-manager-parfait.netlify.app,http://localhost:*,http://127.0.0.1:*}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
