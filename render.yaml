databases:
  - name: task-db
    plan: free
    databaseName: task_manager
    user: taskuser
    region: oregon

services:
  - type: web
    name: task-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://task-manager-parfait.netlify.app,http://localhost:5173,http://127.0.0.1:5173
